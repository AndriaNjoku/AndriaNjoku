<title id="title">Engineering stack</title><desc id="desc">Mobile app development: Android, Kotlin, Jetpack Compose and React Native / Expo. Backend: Kotlin and Ktor. Web: TypeScript and React. AI pipelines: OpenAI APIs, embeddings, batch inference, retrieval, structured outputs and evidence review. Cloud: AWS, Terraform, ECS Fargate and EventBridge. Data: MySQL, Flyway, REST and GraphQL. Delivery: GitHub Actions, CloudWatch and New Relic.</desc>
